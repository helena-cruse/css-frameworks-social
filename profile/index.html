<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hashtag-Social — Profile</title>
    <link rel="icon" href="/media/hastag-Social-logo.png" />
    <link rel="stylesheet" href="/dist/styles.css" />
  </head>

  <body class="min-h-screen bg-[#FAFAFA] text-gray-900 pb-20">
    <header class="sticky top-0 z-20 border-b bg-white/95 backdrop-blur">
      <nav
        class="mx-auto flex max-w-5xl items-center justify-between px-4 py-3"
      >
        <a href="/feed/" class="flex items-center gap-3">
          <img
            src="/media/hastag-Social-logo.png"
            alt="Hashtag-Social"
            class="h-10 w-10 rounded-xl"
          />
          <span class="font-bold">Hashtag Social</span>
        </a>

        <button
          id="navToggle"
          class="rounded-full border px-3 py-2 text-sm md:hidden"
        >
          ☰
        </button>

        <ul class="hidden items-center gap-6 text-sm font-semibold md:flex">
          <li>
            <a href="/feed/" class="text-gray-600 hover:text-blue-600">Feed</a>
          </li>
          <li><a href="/profile/" class="text-blue-600">Profile</a></li>
        </ul>
      </nav>

      <ul id="navListMobile" class="hidden border-t bg-white md:hidden">
        <li><a href="/feed/" class="block px-4 py-3 font-semibold">Feed</a></li>
        <li>
          <a
            href="/profile/"
            class="block px-4 py-3 font-semibold text-blue-600"
            >Profile</a
          >
        </li>
      </ul>
    </header>

    <main class="mx-auto max-w-5xl px-4 py-8">
      <section class="rounded-3xl border bg-white p-6 shadow-sm md:p-10">
        <div class="flex flex-col items-center text-center">
          <img
            id="profileImage"
            src="https://i.pravatar.cc/150?img=13"
            alt="Profile picture"
            class="h-32 w-32 rounded-full object-cover ring-4 ring-blue-100"
          />

          <h1 id="profileName" class="mt-5 text-3xl font-black">Brigt</h1>
          <p class="font-bold text-gray-900">Member</p>
          <p
            id="profileBio"
            class="mt-4 max-w-xl text-sm leading-7 text-gray-500"
          >
            Sharing moments, thoughts and a bit of inspiration every day.
          </p>

          <div class="mt-6 flex gap-8 text-sm">
            <div>
              <span id="postsCount" class="block text-xl font-black">0</span
              >Posts
            </div>
            <div>
              <span id="followersCount" class="block text-xl font-black"
                >248</span
              >Followers
            </div>
            <div>
              <span id="followingCount" class="block text-xl font-black"
                >192</span
              >Following
            </div>
          </div>

          <button
            id="editProfile"
            class="mt-7 rounded-full bg-blue-600 px-6 py-3 text-sm font-bold text-white hover:bg-blue-700"
          >
            Edit Profile
          </button>
        </div>
      </section>

      <section
        id="editProfilePanel"
        class="mt-6 hidden rounded-3xl border bg-white p-5 shadow-sm"
      >
        <h2 class="text-xl font-black">Edit profile</h2>

        <form id="editProfileForm" class="mt-5 grid gap-4 md:grid-cols-2">
          <input
            id="editName"
            type="text"
            required
            placeholder="Display name"
            class="rounded-2xl border bg-gray-50 px-4 py-3 text-sm outline-none focus:ring-4 focus:ring-blue-100"
          />
          <input
            id="editImage"
            type="url"
            placeholder="Image URL"
            class="rounded-2xl border bg-gray-50 px-4 py-3 text-sm outline-none focus:ring-4 focus:ring-blue-100"
          />
          <textarea
            id="editBio"
            rows="4"
            required
            placeholder="Bio"
            class="resize-none rounded-2xl border bg-gray-50 px-4 py-3 text-sm outline-none focus:ring-4 focus:ring-blue-100 md:col-span-2"
          ></textarea>

          <div class="flex gap-3 md:col-span-2">
            <button
              class="rounded-full bg-blue-600 px-5 py-3 text-sm font-bold text-white hover:bg-blue-700"
            >
              Save
            </button>
            <button
              id="cancelEditProfile"
              type="button"
              class="rounded-full border px-5 py-3 text-sm font-bold"
            >
              Cancel
            </button>
          </div>
        </form>
      </section>

      <section class="mt-10">
        <h2 class="text-2xl font-black">Your posts</h2>
        <div
          id="profilePosts"
          class="mt-5 grid gap-4 sm:grid-cols-2 lg:grid-cols-3"
        ></div>

        <div
          id="noPosts"
          class="mt-5 hidden rounded-3xl border border-dashed bg-white p-10 text-center text-sm text-gray-500"
        >
          No posts yet. Create one in your Feed.
        </div>
      </section>
    </main>

    <footer
      class="fixed bottom-0 left-0 w-full border-t bg-white/90 p-4 text-center text-sm text-gray-500 backdrop-blur"
    >
      © Hashtag-Social
    </footer>

    <script src="./profile.js"></script>
  </body>
</html>
