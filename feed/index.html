<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hashtag-Social — Feed</title>
    <link rel="icon" href="/media/hastag-Social-logo.png" />
    <link rel="stylesheet" href="/dist/styles.css" />
  </head>

  <body class="min-h-screen bg-[#FAFAFA] text-gray-900 pb-20">
    <header class="sticky top-0 z-20 border-b bg-white/95 backdrop-blur">
      <nav
        class="mx-auto flex max-w-5xl items-center justify-between px-4 py-3"
      >
        <a href="/feed/" class="flex items-center gap-3">
          <img
            src="/media/hastag-Social-logo.png"
            alt="Hashtag-Social"
            class="h-10 w-10 rounded-xl"
          />
          <span class="font-bold">Hashtag Social</span>
        </a>

        <button
          id="navToggle"
          class="rounded-full border px-3 py-2 text-sm md:hidden"
        >
          ☰
        </button>

        <ul class="hidden items-center gap-6 text-sm font-semibold md:flex">
          <li><a href="/feed/" class="text-blue-600">Feed</a></li>
          <li>
            <a href="/profile/" class="text-gray-600 hover:text-blue-600"
              >Profile</a
            >
          </li>
        </ul>
      </nav>

      <ul id="navListMobile" class="hidden border-t bg-white md:hidden">
        <li>
          <a href="/feed/" class="block px-4 py-3 font-semibold text-blue-600"
            >Feed</a
          >
        </li>
        <li>
          <a href="/profile/" class="block px-4 py-3 font-semibold">Profile</a>
        </li>
      </ul>
    </header>

    <main
      class="mx-auto grid max-w-5xl gap-6 px-4 py-6 md:grid-cols-[280px_1fr]"
    >
      <aside class="space-y-4">
        <section class="rounded-3xl border bg-white p-5 shadow-sm">
          <div class="flex items-center gap-4">
            <img
              src="https://i.pravatar.cc/150?img=13"
              alt="Profile"
              class="h-16 w-16 rounded-full object-cover"
            />
            <div>
              <h1 class="font-black">Brigt</h1>
            </div>
          </div>

          <a
            href="/profile/"
            class="mt-5 block rounded-full bg-blue-600 px-4 py-2.5 text-center text-sm font-bold text-white hover:bg-blue-700"
          >
            View profile
          </a>
        </section>

        <section class="rounded-3xl border bg-white p-5 shadow-sm">
          <label
            for="searchInput"
            class="text-xs font-bold uppercase tracking-[0.18em] text-gray-500"
            >Search</label
          >
          <input
            id="searchInput"
            type="search"
            placeholder="Search posts..."
            class="mt-3 w-full rounded-full border bg-gray-50 px-4 py-3 text-sm outline-none focus:ring-4 focus:ring-blue-100"
          />
        </section>

        <section class="rounded-3xl border bg-white p-5 shadow-sm">
          <p id="postCount" class="text-3xl font-black text-blue-600">0</p>
          <p class="text-sm text-gray-500">posts in your feed</p>
        </section>
      </aside>

      <section class="space-y-5">
        <section class="rounded-3xl border bg-white p-5 shadow-sm">
          <div class="flex items-start gap-4">
            <img
              src="https://i.pravatar.cc/150?img=13"
              alt=""
              class="h-11 w-11 rounded-full object-cover"
            />
            <div class="flex-1">
              <button
                id="createToggle"
                class="w-full rounded-full border bg-gray-50 px-4 py-3 text-left text-sm text-gray-500 hover:bg-blue-50"
              >
                What’s on your mind?
              </button>
            </div>
          </div>

          <form id="createForm" class="mt-5 hidden space-y-3">
            <input
              id="postTitle"
              type="text"
              required
              placeholder="Post title"
              class="w-full rounded-2xl border bg-gray-50 px-4 py-3 text-sm outline-none focus:ring-4 focus:ring-blue-100"
            />
            <input
              id="postImage"
              type="url"
              placeholder="Image URL (optional)"
              class="w-full rounded-2xl border bg-gray-50 px-4 py-3 text-sm outline-none focus:ring-4 focus:ring-blue-100"
            />
            <textarea
              id="postBody"
              required
              minlength="3"
              rows="4"
              placeholder="Write something..."
              class="w-full resize-none rounded-2xl border bg-gray-50 px-4 py-3 text-sm outline-none focus:ring-4 focus:ring-blue-100"
            ></textarea>
            <button
              class="rounded-full bg-blue-600 px-6 py-3 text-sm font-bold text-white hover:bg-blue-700"
            >
              Publish
            </button>
          </form>
        </section>

        <div
          id="toast"
          class="hidden rounded-2xl border border-green-200 bg-green-50 px-4 py-3 text-sm font-bold text-green-800"
        >
          Post published successfully.
        </div>

        <section
          id="emptyState"
          class="rounded-3xl border border-dashed bg-white p-10 text-center shadow-sm"
        >
          <div
            class="mx-auto grid h-16 w-16 place-items-center rounded-full bg-blue-50 text-3xl font-black text-blue-600"
          >
            #
          </div>
          <h2 id="emptyTitle" class="mt-4 text-xl font-black">No posts yet</h2>
          <p id="emptyText" class="mt-2 text-sm text-gray-500">
            Create your first post to get started.
          </p>
          <button
            id="createToggleEmpty"
            class="mt-5 rounded-full bg-blue-600 px-5 py-2.5 text-sm font-bold text-white hover:bg-blue-700"
          >
            Create post
          </button>
        </section>

        <section id="postsGrid" class="hidden space-y-5"></section>
      </section>
    </main>

    <footer
      class="fixed bottom-0 left-0 w-full border-t bg-white/90 p-4 text-center text-sm text-gray-500 backdrop-blur"
    >
      © Hashtag-Social
    </footer>

    <script src="./feed.js"></script>
  </body>
</html>
